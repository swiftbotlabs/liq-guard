# Liq Guard backend. SIM is the default; LIVE = Binance futures TESTNET with the key in Worker secrets.
name = "liq-guard"
main = "src/index.ts"
compatibility_date = "2025-11-01"
workers_dev = true

[vars]
MODE = "SIM"            # "SIM" | "LIVE"
DEMO_CONTROLS = "1"     # SIM-only labelled price-shock control for demos; set "0" to disable
MAX_ORDER_NOTIONAL = "25000"
MAX_MARGIN_ADD = "1000"
MAX_MARGIN_DAY = "3000"
# SIM price route: relay first (the testnet refuses Cloudflare egress), then the testnet directly, then labelled simulated prices.
PRICE_RELAY_URL = "https://liq-guard-prices.onrender.com"

# Secrets (never in this file):
#   wrangler secret put PRICE_RELAY_TOKEN       (SIM: the relay's RELAY_TOKEN)
#   wrangler secret put BINANCE_TESTNET_KEY     (LIVE only)
#   wrangler secret put BINANCE_TESTNET_SECRET  (LIVE only)
#   wrangler secret put LIVE_PAIR_CODE          (LIVE only: code the phone enters once)

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "DESK"
class_name = "DeskDO"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeskDO", "Limiter"]

[observability]
enabled = false

# ---- LIVE on the Binance futures TESTNET: `wrangler deploy --config worker/wrangler.toml --env live`
# Secrets for this env: wrangler secret put BINANCE_TESTNET_KEY|BINANCE_TESTNET_SECRET|LIVE_PAIR_CODE --env live
[env.live]
name = "liq-guard-live"

[env.live.vars]
MODE = "LIVE"
DEMO_CONTROLS = "0"
MAX_ORDER_NOTIONAL = "25000"
MAX_MARGIN_ADD = "1000"
MAX_MARGIN_DAY = "3000"

[env.live.ai]
binding = "AI"

[[env.live.durable_objects.bindings]]
name = "DESK"
class_name = "DeskDO"

[[env.live.durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"
